name: Build Packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feat/app-packaging
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  fpk:
    name: fnOS FPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - run: npm ci
      - run: ./packaging/fnos/build-fpk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: papersplit-fpk
          path: dist-packages/*.fpk

  macos:
    name: macOS App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - run: npm ci
      - run: ARCH=universal ./packaging/macos/build-app.sh
      - run: ARCH=x86_64 ./packaging/macos/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: papersplit-macos
          path: dist-app/*.zip

  release:
    name: Attach to Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [fpk, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
